<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка - Классическая игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(45deg, #FFD700, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .score {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        #gameCanvas {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .control-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            border: none;
            color: white;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-content {
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: gameOverAnimation 0.5s ease-out;
        }

        @keyframes gameOverAnimation {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .game-over h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .restart-btn {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .instructions {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
                margin: 10px;
            }

            h1 {
                font-size: 2em;
            }

            #gameCanvas {
                width: 300px !important;
                height: 300px !important;
            }

            .controls {
                flex-direction: column;
            }

            .control-btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Змейка</h1>
        
        <div class="score-board">
            <div class="score">Счёт: <span id="score">0</span></div>
            <div class="score">Лучший: <span id="highScore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button class="control-btn" onclick="changeDirection('UP')">⬆️</button>
            <button class="control-btn" onclick="changeDirection('LEFT')">⬅️</button>
            <button class="control-btn" onclick="changeDirection('DOWN')">⬇️</button>
            <button class="control-btn" onclick="changeDirection('RIGHT')">➡️</button>
            <button class="control-btn" onclick="togglePause()">⏯️ Пауза</button>
            <button class="control-btn" onclick="restartGame()">🔄 Заново</button>
        </div>

        <div class="instructions">
            <p>🎮 Управление: стрелки на клавиатуре или кнопки</p>
            <p>🍎 Собирайте еду, чтобы расти и получать очки</p>
            <p>❌ Не врезайтесь в стены и свой хвост!</p>
        </div>
    </div>

    <div id="gameOver" class="game-over">
        <div class="game-over-content">
            <h2>💀 Игра окончена!</h2>
            <p>Ваш счёт: <span id="finalScore">0</span></p>
            <p id="newRecord" style="display: none;">🎉 Новый рекорд!</p>
            <button class="restart-btn" onclick="restartGame()">🚀 Играть снова</button>
        </div>
    </div>

    <script>
        // Получение элементов
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const newRecordElement = document.getElementById('newRecord');

        // Игровые константы
        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        // Игровые переменные
        let snake = [
            {x: 10, y: 10}
        ];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gamePaused = false;

        // Инициализация
        highScoreElement.textContent = highScore;
        randomFood();
        drawGame();

        // Генерация случайной позиции для еды
        function randomFood() {
            food = {
                x: Math.floor(Math.random() * TILE_COUNT),
                y: Math.floor(Math.random() * TILE_COUNT)
            };

            // Проверяем, чтобы еда не появилась на змейке
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    randomFood();
                    return;
                }
            }
        }

        // Отрисовка игры
        function drawGame() {
            // Очистка canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Отрисовка змейки
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Голова змейки
                    const gradient = ctx.createLinearGradient(
                        segment.x * GRID_SIZE, segment.y * GRID_SIZE,
                        segment.x * GRID_SIZE + GRID_SIZE, segment.y * GRID_SIZE + GRID_SIZE
                    );
                    gradient.addColorStop(0, '#4CAF50');
                    gradient.addColorStop(1, '#45a049');
                    ctx.fillStyle = gradient;
                } else {
                    // Тело змейки
                    const gradient = ctx.createLinearGradient(
                        segment.x * GRID_SIZE, segment.y * GRID_SIZE,
                        segment.x * GRID_SIZE + GRID_SIZE, segment.y * GRID_SIZE + GRID_SIZE
                    );
                    gradient.addColorStop(0, '#66BB6A');
                    gradient.addColorStop(1, '#4CAF50');
                    ctx.fillStyle = gradient;
                }

                ctx.fillRect(segment.x * GRID_SIZE + 1, segment.y * GRID_SIZE + 1, 
                           GRID_SIZE - 2, GRID_SIZE - 2);
                
                // Добавляем блик
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(segment.x * GRID_SIZE + 2, segment.y * GRID_SIZE + 2, 
                           GRID_SIZE - 8, GRID_SIZE - 8);
            });

            // Отрисовка еды
            const foodGradient = ctx.createRadialGradient(
                food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, 0,
                food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2
            );
            foodGradient.addColorStop(0, '#FF6B6B');
            foodGradient.addColorStop(1, '#FF5252');
            ctx.fillStyle = foodGradient;
            
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, 
                   GRID_SIZE/2 - 1, 0, 2 * Math.PI);
            ctx.fill();

            // Добавляем блик на еду
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE/3, food.y * GRID_SIZE + GRID_SIZE/3, 
                   GRID_SIZE/6, 0, 2 * Math.PI);
            ctx.fill();
        }

        // Основной игровой цикл
        function gameLoop() {
            if (!gameRunning || gamePaused) return;

            update();
            drawGame();
        }

        // Обновление игры
        function update() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Проверка столкновения со стенами
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // Проверка столкновения с собой
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Проверка поедания еды
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                randomFood();

                // Увеличение скорости игры
                if (gameInterval) {
                    clearInterval(gameInterval);
                    const newSpeed = Math.max(50, 200 - Math.floor(score / 50) * 10);
                    gameInterval = setInterval(gameLoop, newSpeed);
                }
            } else {
                snake.pop();
            }
        }

        // Завершение игры
        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            
            finalScoreElement.textContent = score;
            
            if (score > highScore) {
                highScore = score;
                highScoreElement.textContent = highScore;
                localStorage.setItem('snakeHighScore', highScore);
                newRecordElement.style.display = 'block';
            } else {
                newRecordElement.style.display = 'none';
            }
            
            gameOverElement.style.display = 'flex';
        }

        // Перезапуск игры
        function restartGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            randomFood();
            gameOverElement.style.display = 'none';
            gameRunning = false;
            gamePaused = false;
            drawGame();
        }

        // Изменение направления
        function changeDirection(direction) {
            if (!gameRunning && !gamePaused) {
                startGame();
            }
            
            if (gamePaused) return;

            switch(direction) {
                case 'UP':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'DOWN':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'LEFT':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'RIGHT':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        }

        // Старт игры
        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                gameInterval = setInterval(gameLoop, 200);
            }
        }

        // Пауза/продолжение
        function togglePause() {
            if (!gameRunning) {
                startGame();
                return;
            }
            
            gamePaused = !gamePaused;
            if (!gamePaused) {
                gameInterval = setInterval(gameLoop, Math.max(50, 200 - Math.floor(score / 50) * 10));
            } else {
                clearInterval(gameInterval);
            }
        }

        let gameInterval;

        // Обработка клавиатуры
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'ArrowUp':
                case 'KeyW':
                    e.preventDefault();
                    changeDirection('UP');
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    e.preventDefault();
                    changeDirection('DOWN');
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    e.preventDefault();
                    changeDirection('LEFT');
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    e.preventDefault();
                    changeDirection('RIGHT');
                    break;
                case 'Space':
                    e.preventDefault();
                    togglePause();
                    break;
                case 'KeyR':
                    e.preventDefault();
                    restartGame();
                    break;
            }
        });

        // Обработка свайпов для мобильных устройств
        let startX, startY;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!startX || !startY) return;

            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;

            const diffX = startX - endX;
            const diffY = startY - endY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    changeDirection('LEFT');
                } else {
                    changeDirection('RIGHT');
                }
            } else {
                if (diffY > 0) {
                    changeDirection('UP');
                } else {
                    changeDirection('DOWN');
                }
            }

            startX = null;
            startY = null;
        });

        // Предотвращение прокрутки на мобильных устройствах
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

    </script>
</body>
</html>
