<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра 2024</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .game-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 20px;
        }

        .score-box {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            flex: 1;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .score-box h3 {
            font-size: 0.9rem;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .score-box .score {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .game-board {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            aspect-ratio: 1;
        }

        .cell {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            aspect-ratio: 1;
        }

        .cell.tile-2 { background: #eee4da; color: #776e65; }
        .cell.tile-4 { background: #ede0c8; color: #776e65; }
        .cell.tile-8 { background: #f2b179; color: #f9f6f2; }
        .cell.tile-16 { background: #f59563; color: #f9f6f2; }
        .cell.tile-32 { background: #f67c5f; color: #f9f6f2; }
        .cell.tile-64 { background: #f65e3b; color: #f9f6f2; }
        .cell.tile-128 { background: #edcf72; color: #f9f6f2; font-size: 1.2rem; }
        .cell.tile-256 { background: #edcc61; color: #f9f6f2; font-size: 1.2rem; }
        .cell.tile-512 { background: #edc850; color: #f9f6f2; font-size: 1.2rem; }
        .cell.tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1rem; }
        .cell.tile-2024 { background: #ff6b6b; color: #f9f6f2; font-size: 1rem; animation: winner 1s ease-in-out infinite alternate; }

        @keyframes winner {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .cell.new-tile {
            animation: appear 0.3s ease;
        }

        @keyframes appear {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .instructions {
            margin-top: 20px;
            opacity: 0.9;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .game-over, .game-won {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.3);
        }

        .modal h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .modal p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.5rem; }
            .cell { font-size: 1.2rem; }
            .cell.tile-128, .cell.tile-256, .cell.tile-512 { font-size: 1rem; }
            .cell.tile-1024, .cell.tile-2024 { font-size: 0.8rem; }
            .game-board { padding: 10px; grid-gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>2024</h1>
        
        <div class="score-container">
            <div class="score-box">
                <h3>СЧЁТ</h3>
                <div class="score" id="score">0</div>
            </div>
            <div class="score-box">
                <h3>ЛУЧШИЙ</h3>
                <div class="score" id="best-score">0</div>
            </div>
        </div>

        <div class="game-board" id="game-board">
            <!-- Cells will be generated by JavaScript -->
        </div>

        <div class="controls">
            <button class="btn" onclick="newGame()">Новая игра</button>
        </div>

        <div class="instructions">
            <p>Используйте стрелки на клавиатуре или свайпы для перемещения плиток.</p>
            <p>Когда две плитки с одинаковым числом соприкасаются, они объединяются!</p>
            <p><strong>Цель: собрать плитку 2024!</strong></p>
        </div>
    </div>

    <div id="game-over" class="game-over hidden">
        <div class="modal">
            <h2>Игра окончена!</h2>
            <p>Ваш счёт: <span id="final-score">0</span></p>
            <button class="btn" onclick="newGame()">Попробовать снова</button>
        </div>
    </div>

    <div id="game-won" class="game-won hidden">
        <div class="modal">
            <h2>Поздравляем!</h2>
            <p>Вы достигли 2024!</p>
            <p>Счёт: <span id="win-score">0</span></p>
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                <button class="btn" onclick="continueGame()">Продолжить</button>
                <button class="btn" onclick="newGame()">Новая игра</button>
            </div>
        </div>
    </div>

    <script>
        class Game2024 {
            constructor() {
                this.board = [];
                this.score = 0;
                this.bestScore = parseInt(localStorage.getItem('best-score-2024') || '0');
                this.gameWon = false;
                this.gameOver = false;
                this.size = 4;
                
                this.initGame();
                this.updateDisplay();
                this.bindEvents();
            }

            initGame() {
                // Initialize empty board
                this.board = Array(this.size).fill().map(() => Array(this.size).fill(0));
                this.score = 0;
                this.gameWon = false;
                this.gameOver = false;
                
                // Add two random tiles
                this.addRandomTile();
                this.addRandomTile();
                
                this.updateDisplay();
            }

            addRandomTile() {
                const emptyCells = [];
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this.board[i][j] === 0) {
                            emptyCells.push([i, j]);
                        }
                    }
                }
                
                if (emptyCells.length > 0) {
                    const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    const value = Math.random() < 0.9 ? 2 : 4;
                    this.board[randomCell[0]][randomCell[1]] = value;
                    return randomCell;
                }
                return null;
            }

            updateDisplay() {
                const gameBoard = document.getElementById('game-board');
                gameBoard.innerHTML = '';
                
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        
                        const value = this.board[i][j];
                        if (value !== 0) {
                            cell.textContent = value;
                            cell.classList.add(`tile-${value}`);
                        }
                        
                        gameBoard.appendChild(cell);
                    }
                }
                
                document.getElementById('score').textContent = this.score;
                document.getElementById('best-score').textContent = this.bestScore;
                
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('best-score-2024', this.bestScore.toString());
                    document.getElementById('best-score').textContent = this.bestScore;
                }
            }

            canMove() {
                // Check for empty cells
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this.board[i][j] === 0) return true;
                    }
                }
                
                // Check for possible merges
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        const current = this.board[i][j];
                        if ((i < this.size - 1 && this.board[i + 1][j] === current) ||
                            (j < this.size - 1 && this.board[i][j + 1] === current)) {
                            return true;
                        }
                    }
                }
                
                return false;
            }

            move(direction) {
                if (this.gameOver) return;
                
                let moved = false;
                const newBoard = this.board.map(row => [...row]);
                
                if (direction === 'left' || direction === 'right') {
                    for (let i = 0; i < this.size; i++) {
                        const row = direction === 'left' ? 
                            this.processLine(newBoard[i]) : 
                            this.processLine(newBoard[i].reverse()).reverse();
                        
                        for (let j = 0; j < this.size; j++) {
                            if (newBoard[i][j] !== row[j]) {
                                moved = true;
                            }
                            newBoard[i][j] = row[j];
                        }
                    }
                } else {
                    for (let j = 0; j < this.size; j++) {
                        const column = [];
                        for (let i = 0; i < this.size; i++) {
                            column.push(newBoard[i][j]);
                        }
                        
                        const processedColumn = direction === 'up' ? 
                            this.processLine(column) : 
                            this.processLine(column.reverse()).reverse();
                        
                        for (let i = 0; i < this.size; i++) {
                            if (newBoard[i][j] !== processedColumn[i]) {
                                moved = true;
                            }
                            newBoard[i][j] = processedColumn[i];
                        }
                    }
                }
                
                if (moved) {
                    this.board = newBoard;
                    setTimeout(() => {
                        this.addRandomTile();
                        this.updateDisplay();
                        this.checkGameState();
                    }, 150);
                }
            }

            processLine(line) {
                // Remove zeros
                let newLine = line.filter(cell => cell !== 0);
                
                // Merge adjacent equal values
                for (let i = 0; i < newLine.length - 1; i++) {
                    if (newLine[i] === newLine[i + 1]) {
                        newLine[i] *= 2;
                        this.score += newLine[i];
                        newLine[i + 1] = 0;
                        
                        if (newLine[i] === 2024 && !this.gameWon) {
                            this.gameWon = true;
                            setTimeout(() => this.showWinScreen(), 500);
                        }
                    }
                }
                
                // Remove zeros again and pad with zeros
                newLine = newLine.filter(cell => cell !== 0);
                while (newLine.length < this.size) {
                    newLine.push(0);
                }
                
                return newLine;
            }

            checkGameState() {
                if (!this.canMove()) {
                    this.gameOver = true;
                    setTimeout(() => this.showGameOverScreen(), 500);
                }
            }

            showGameOverScreen() {
                document.getElementById('final-score').textContent = this.score;
                document.getElementById('game-over').classList.remove('hidden');
            }

            showWinScreen() {
                document.getElementById('win-score').textContent = this.score;
                document.getElementById('game-won').classList.remove('hidden');
            }

            bindEvents() {
                // Keyboard events
                document.addEventListener('keydown', (e) => {
                    if (this.gameOver) return;
                    
                    switch(e.key) {
                        case 'ArrowUp':
                            e.preventDefault();
                            this.move('up');
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            this.move('down');
                            break;
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.move('left');
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.move('right');
                            break;
                    }
                });

                // Touch events for mobile
                let touchStartX = 0;
                let touchStartY = 0;

                document.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                });

                document.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                });

                document.addEventListener('touchend', (e) => {
                    if (this.gameOver) return;
                    
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    
                    const deltaX = touchEndX - touchStartX;
                    const deltaY = touchEndY - touchStartY;
                    
                    const minSwipeDistance = 50;
                    
                    if (Math.abs(deltaX) > Math.abs(deltaY)) {
                        if (Math.abs(deltaX) > minSwipeDistance) {
                            this.move(deltaX > 0 ? 'right' : 'left');
                        }
                    } else {
                        if (Math.abs(deltaY) > minSwipeDistance) {
                            this.move(deltaY > 0 ? 'down' : 'up');
                        }
                    }
                });
            }
        }

        let game;

        function newGame() {
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('game-won').classList.add('hidden');
            game = new Game2024();
        }

        function continueGame() {
            document.getElementById('game-won').classList.add('hidden');
            game.gameWon = false;
        }

        // Initialize game when page loads
        window.addEventListener('load', () => {
            newGame();
        });
    </script>
</body>
</html>
