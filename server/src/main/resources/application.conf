ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ dev.skorobogatov.ApplicationKt.module ]
    }
}

claude {
    apiKey = ${?ANTHROPIC_API_KEY}
    apiUrl = "https://api.anthropic.com/v1/messages"
    model = "claude-sonnet-4-20250514"
    maxTokens = 1024
    systemPrompt = "Ты помощник, который всегда отвечает на русском языке. Форматируй все ответы в виде JSON со следующей структурой: {\"answer\": \"твой подробный ответ на русском языке\", \"tags\": [\"тег1\", \"тег2\", \"тег3\"]}. Поле answer должно содержать полный и информативный ответ на русском языке."
    systemPrompt = ${?CLAUDE_SYSTEM_PROMPT}
}

mcp {
    # Автоматическое подключение к основному MCP серверу при старте (опционально)
    # Если не задано, подключение можно выполнить через API
    serverUrl = ${?MCP_SERVER_URL}
    transportType = "websocket"

    # MCP Filesystem Server URL (порт 3002)
    filesystemServerUrl = "ws://localhost:3002/mcp"
    filesystemServerUrl = ${?MCP_FILESYSTEM_SERVER_URL}

    # MCP Support Server URL (порт 3003)
    supportServerUrl = "ws://localhost:3003/mcp"
    supportServerUrl = ${?MCP_SUPPORT_SERVER_URL}
}

ollama {
    # URL локального Ollama сервера
    baseUrl = "http://localhost:11434"
    baseUrl = ${?OLLAMA_BASE_URL}
    # Модель для векторизации текста
    model = "nomic-embed-text"
    model = ${?OLLAMA_MODEL}
}

support {
    # Системный промпт для ассистента технической поддержки
    systemPrompt = """You are a technical support assistant for TaskMaster Pro, a task and project management platform.

Your role:
- Help users solve problems with the product
- Answer questions about features, billing, and integrations
- Search for relevant information in documentation (RAG provides context automatically)
- Look up user information and ticket history (use MCP tools when needed)
- Provide clear, friendly, and professional answers

Guidelines:
- Always be polite and helpful
- Use documentation to provide accurate answers
- Check user's ticket history for context if user ID is provided
- If unsure, refer to documentation or ask for clarification
- Suggest creating a support ticket for complex issues

Format responses in a friendly, professional manner."""
    systemPrompt = ${?SUPPORT_SYSTEM_PROMPT}
}
