<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Claude Assistant</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar with conversations list -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Диалоги</h2>
                <button id="newChatButton" class="new-chat-button" title="Создать новый диалог">
                    ➕
                </button>
            </div>
            <div id="conversationsList" class="conversations-list">
                <div class="loading">Загрузка...</div>
            </div>
        </aside>

        <!-- Main chat area -->
        <div class="main-content">
            <header>
                <h1 id="chatTitle">AI Chat Assistant</h1>
                <p class="subtitle">Powered by Claude AI</p>
                <button id="viewHistoryButton" class="history-button" title="Просмотр истории диалога">
                    📜 История
                </button>
            </header>

            <div class="chat-container">
            <div id="messages" class="messages">
                <div class="message assistant">
                    <div class="message-content">
                        <strong>Assistant:</strong> Привет! Я готов помочь вам. Задайте любой вопрос.
                    </div>
                </div>
            </div>

            <form id="chatForm" class="input-form">
                <div class="model-selector">
                    <label for="modelSelect">Модель:</label>
                    <select id="modelSelect">
                        <option value="claude-3-haiku-20240307">Haiku (Быстрая и доступная)</option>
                        <option value="claude-sonnet-4-20250514" selected>Sonnet 4 (Самая продвинутая)</option>
                    </select>
                </div>
                <div class="input-row">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Напишите сообщение..."
                        autocomplete="off"
                        required
                    >
                    <button type="submit" id="sendButton">
                        Отправить
                    </button>
                </div>
            </form>
        </div>

            <footer>
                <p>AI Chat Service | REST API at <code>/api/chat</code></p>
            </footer>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>История диалога</h2>
                <button class="close-button" id="closeModalButton">&times;</button>
            </div>
            <div class="modal-body">
                <div id="historyInfo" class="history-info"></div>
                <div id="historyMessages" class="history-messages"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
